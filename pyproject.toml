[tool.poetry]
name = "r2d2-galactic-communicator"
version = "0.1.0"
description = "A Star Wars-themed Morse code translator with CLI and JSON storage"
authors = ["Masingita Maluleke <your.email@example.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/yourusername/r2d2-galactic-communicator"
keywords = ["morse-code", "python", "cli", "star-wars"]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.7"
rich = "^13.7.1"
pytest = "^8.3.2"
hypothesis = "^6.108.4"

[tool.poetry.scripts]
morse-cli = "r2d2_morse.cli:cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"